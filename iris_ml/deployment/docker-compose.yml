name: pmldl-iris
services:
  api:
    build:
      context: ../..
      dockerfile: iris_ml/deployment/api/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  app:
    build:
      context: ../..
      dockerfile: iris_ml/deployment/app/Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${APP_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
